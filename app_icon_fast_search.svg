<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 1. 背景圆角矩形渐变：翡翠微光至深林翠绿 -->
    <linearGradient id="search_bg_gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <!-- 2. 放大镜主镜片底托微光渐变 -->
    <linearGradient id="lens_gradient" x1="110" y1="110" x2="362" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F0FDF4" stop-opacity="0.85" />
    </linearGradient>
  </defs>

  <!-- 1. 背景圆角矩形 -->
  <path d="M128,0 L384,0 A128,128 0 0 1 512,128 L512,384 A128,128 0 0 1 384,512 L128,512 A128,128 0 0 1 0,384 L0,128 A128,128 0 0 1 128,0 Z" fill="url(#search_bg_gradient)" />

  <!-- 2. 扁平放大镜透光大圆盘 (白色 22% 透明度) -->
  <circle cx="236" cy="236" r="148" fill="#FFFFFF" fill-opacity="0.22" />

  <!-- 3. 放大镜主镜片底托 -->
  <circle cx="236" cy="236" r="126" fill="url(#lens_gradient)" />

  <!-- 4. 放大镜外金属质感镜框 -->
  <circle cx="236" cy="236" r="126" fill="none" stroke="#FFFFFF" stroke-width="18" />

  <!-- 5. 放大镜手柄 (外层白色粗描边 + 内层墨绿细描边) -->
  <line x1="332" y1="332" x2="424" y2="424" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" />
  <line x1="332" y1="332" x2="424" y2="424" stroke="#047857" stroke-width="18" stroke-linecap="round" />

  <!-- 6. “一叶” 家族核心标志性翠绿叶脉 -->
  <!-- 主叶脉分支 -->
  <path d="M168,318 C188,300 232,264 266,218 C300,172 322,160 322,160" stroke="#059669" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- 次级叶脉 1 -->
  <path d="M230,266 C252,252 278,250 298,244" stroke="#10B981" stroke-width="12" stroke-linecap="round" fill="none" />

  <!-- 次级叶脉 2 -->
  <path d="M260,226 C280,212 300,212 314,206" stroke="#10B981" stroke-width="12" stroke-linecap="round" fill="none" />

  <!-- 顶部轻盈初生嫩芽点 -->
  <circle cx="322" cy="160" r="14" fill="#10B981" />

  <!-- 7. 右上方极速闪电 -->
  <path d="M380,80 L350,136 H386 L360,196 L422,126 H384 Z" fill="#FBBF24" />
</svg>
