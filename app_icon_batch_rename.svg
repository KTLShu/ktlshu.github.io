<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 1. 背景底板渐变：一叶经典翡翠微光到深邃森林翠绿 -->
    <linearGradient id="bg_gradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- 2. 主卡片正面渐变 -->
    <linearGradient id="card_front_gradient" x1="120" y1="120" x2="420" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2FDF6"/>
    </linearGradient>

    <!-- 3. 文件折角背光渐变 -->
    <linearGradient id="fold_gradient" x1="320" y1="120" x2="380" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- 4. 浮雕与弥散阴影 -->
    <filter id="card_shadow" x="60" y="90" width="392" height="360" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#064E3B" flood-opacity="0.28"/>
    </filter>
    <filter id="leaf_glow" x="110" y="140" width="300" height="300" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#059669" flood-opacity="0.25"/>
    </filter>

    <!-- 5. 核心叶片饱满光泽渐变 -->
    <linearGradient id="leaf_body_gradient" x1="160" y1="360" x2="360" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="60%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- 6. 重命名笔尖金色/光泽高光 -->
    <linearGradient id="nib_gradient" x1="330" y1="160" x2="375" y2="205" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- 1. 图标底板：自适应平滑超级圆角方块 (Squircle) -->
  <rect width="512" height="512" rx="128" fill="url(#bg_gradient)"/>

  <!-- 2. 批量卡片第三层 (Back Card - 代表成批、有序的批量文件) -->
  <rect x="180" y="88" width="200" height="260" rx="20" fill="#FFFFFF" fill-opacity="0.18" transform="rotate(10 280 218)"/>

  <!-- 3. 批量卡片第二层 (Middle Card) -->
  <rect x="156" y="96" width="208" height="268" rx="20" fill="#FFFFFF" fill-opacity="0.32" transform="rotate(5 260 230)"/>

  <!-- 4. 前置主卡片 (Front File Card，带右上角精致折角) -->
  <g filter="url(#card_shadow)">
    <!-- 卡片主体：切除右上角折角 -->
    <path d="M124 136C124 122.745 134.745 112 148 112H320L376 168V376C376 389.255 365.255 400 352 400H148C134.745 400 124 389.255 124 376V136Z" fill="url(#card_front_gradient)"/>
    <!-- 右上角折角翻盖 -->
    <path d="M320 112V152C320 160.837 327.163 168 336 168H376L320 112Z" fill="url(#fold_gradient)"/>
  </g>

  <!-- 5. 卡片上的重命名模拟行与批量标识 -->
  <!-- 文件名编辑输入框底衬 (浅薄荷绿柔和条) -->
  <rect x="156" y="196" width="188" height="28" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
  <!-- 输入光标 (编辑/重命名中) -->
  <rect x="236" y="202" width="2.5" height="16" rx="1" fill="#059669"/>
  <!-- 原文件名抽象行 (灰阶代表正在被重命名的结构) -->
  <rect x="170" y="207" width="56" height="6" rx="3" fill="#059669" fill-opacity="0.8"/>
  
  <!-- 次要属性行 (大小、时间等占位) -->
  <rect x="156" y="240" width="130" height="6" rx="3" fill="#E2E8F0"/>
  <rect x="156" y="258" width="90" height="6" rx="3" fill="#E2E8F0"/>

  <!-- 6. 批量编号徽章 (体现 01、02、03 批量自动化序号) -->
  <g transform="translate(156, 142)">
    <rect width="48" height="22" rx="6" fill="#10B981" fill-opacity="0.15"/>
    <text x="24" y="15.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle"># 01</text>
  </g>

  <!-- 7. 【一叶核心叶子元素】：从左下昂扬舒展至右上，与重命名羽笔融为一体 -->
  <g filter="url(#leaf_glow)">
    <!-- 叶身主轮廓 (有机、自然的饱满叶形，富有生机与跃动感) -->
    <path d="M152 368C162 310 200 240 268 200C315 172 355 160 368 158C366 172 352 214 316 264C268 330 206 368 152 368Z" fill="url(#leaf_body_gradient)"/>

    <!-- 【一叶】主叶脉分支 (传承自一叶文件助手核心弧线) -->
    <path d="M166 354C190 326 238 274 286 226C326 186 352 170 368 158" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- 次级叶脉 1 (向右侧自然生长的分支) -->
    <path d="M236 280C262 268 288 268 312 262" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.85"/>

    <!-- 次级叶脉 2 (叶端分支) -->
    <path d="M276 236C298 224 318 224 336 218" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-opacity="0.85"/>

    <!-- 重命名笔尖 (Leaf Pen Nib - 叶尖演化为闪烁灵感的金色精致编辑笔尖) -->
    <path d="M368 158L382 144C384 142 388 142 390 144L396 150C398 152 398 156 396 158L382 172L368 158Z" fill="url(#nib_gradient)"/>
    <path d="M382 144L392 134L396 150" fill="#FDE68A"/>
    <!-- 笔尖细缝 -->
    <line x1="384" y1="146" x2="390" y2="140" stroke="#78350F" stroke-width="1.5" stroke-linecap="round"/>

    <!-- 标志性活力生机嫩芽点 (Leaf Bud Dot - 与一叶文件助手 100% 精神契合) -->
    <circle cx="396" cy="130" r="10" fill="#34D399"/>
    <circle cx="396" cy="130" r="6" fill="#FFFFFF"/>
  </g>

  <!-- 8. 重命名流光飞线 (象征名称替换变换、瞬时重命名的动态速度线) -->
  <path d="M388 184C380 200 376 220 376 232" stroke="#34D399" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 6"/>
  <circle cx="376" cy="242" r="3" fill="#34D399"/>
</svg>